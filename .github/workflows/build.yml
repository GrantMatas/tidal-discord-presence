name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Offline regression checks
        run: dotnet run --project tests/TidalDiscordPresence.Tests/TidalDiscordPresence.Tests.csproj -c Release
      - name: Build standalone release
        shell: pwsh
        run: ./tools/Build-Release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TidalDiscordPresence-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
